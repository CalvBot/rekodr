<div class="tag">A replay buffer for Windows that keeps <b>hours</b>, not minutes.<br>Clip anything you just played. Free, all of it.</div>
<svg id="tl" viewBox="0 0 1104 104"></svg>
<div class="lab" style="left:88px;top:336px">2 h ago</div>
<div class="lab" style="right:88px;top:336px">now</div>
</div>
<script>
// The buffer: a strip of activity bars, game sessions as brighter runs, a selected region, markers and the live edge.
const NS="http://www.w3.org/2000/svg",svg=document.getElementById('tl'),W=1104,MID=50,STEP=6,BW=3.4;
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;};
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const sessions=[[40,330],[420,760],[820,1080]], sel=[600,742];
const inRun=(x,r)=>x>=r[0]&&x<=r[1];
for(let x=2;x<W-14;x+=STEP){
  const game=sessions.some(r=>inRun(x,r));
  const h=game?8+Math.pow(rnd(),1.4)*30+(Math.sin(x/37)+1)*4:3+rnd()*5;
  const fill=inRun(x,sel)?'#2fc4b2':game?'#3b4644':'#242b2a';
  el('rect',{x:x,y:MID-h/2,width:BW,height:h,rx:1.7,fill:fill});
}
el('rect',{x:sel[0]-6,y:MID-30,width:sel[1]-sel[0]+12,height:60,rx:9,fill:'rgba(0,137,123,.16)',stroke:'#26b3a3','stroke-width':2});
for(const [x,c] of [[150,'#e8c53d'],[268,'#f0434f'],[520,'#5b9cff'],[655,'#e8c53d'],[700,'#f0434f'],[930,'#5b9cff']]){
  el('line',{x1:x,y1:MID-30,x2:x,y2:MID+30,stroke:c,'stroke-width':2,'stroke-opacity':.55});
  el('circle',{cx:x,cy:MID-34,r:5,fill:c});
}
const nx=W-8;
el('line',{x1:nx,y1:MID-32,x2:nx,y2:MID+32,stroke:'#fff','stroke-width':3,'stroke-linecap':'round'});
el('circle',{cx:nx,cy:MID-38,r:9,fill:'rgba(240,67,79,.25)'});
el('circle',{cx:nx,cy:MID-38,r:5,fill:'#f0434f'});
</script></body></html>
