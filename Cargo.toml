[package]
name = "clipback"
version = "0.2.0"
edition = "2024"
description = "Hands-off long replay buffer: screen + every app's audio on its own track, saved in seconds"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "1.2.1"
wasapi = "0.27.0"
# Shares lifelog's app watching (process trees, playing sessions), icons, game list and clipboard code.
lifelog = { path = "../lifelog" }
# DXGI (same outputs, in the same order, as ffmpeg's ddagrab) and display names for the monitor list.
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_HiDpi"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
strip = true
