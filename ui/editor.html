<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit clip · clipback</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
<script src="/icons.js"></script>
<script src="/common.js"></script>
</head>
<body>
<header>
  <button data-icon="arrow-left" onclick="location.href='/'">Clips</button>
  <h1 id="title" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></h1>
  <span class="grow"></span>
</header>
<div class="editor">
  <div class="left">
    <div class="stage-wrap" id="wrap"><div class="stage" id="stage"><video id="video" preload="auto" playsinline></video></div></div>
    <div class="transport">
      <button id="playBtn" data-icon="play" style="width:92px">Play</button>
      <span class="time" id="time">0:00.0 / 0:00.0</span>
      <span class="grow" style="flex:1"></span>
      <span class="time" id="sel"></span>
    </div>
    <div class="timeline" id="tl">
      <div class="shade" id="shadeL"></div><div class="shade" id="shadeR"></div>
      <div class="sel" id="selBox"></div>
      <div class="handle" id="hIn"></div><div class="handle" id="hOut"></div>
      <div id="keys"></div>
      <div class="head" id="head"></div>
    </div>
  </div>
  <div class="side">
    <div>
      <h3>Zoom</h3>
      <div class="field"><label>Zoom</label><input id="zoom" type="range" min="1" max="4" step="0.01" value="1"><span class="val" id="zoomVal">1.00×</span></div>
      <div class="dim small" style="margin:4px 0 8px">Zoom in, then drag the video to aim. Changes go on a keyframe at the playhead; the view eases smoothly between keyframes.</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <button id="addKey" data-icon="diamond">Keyframe</button>
        <button id="delKey" class="danger" data-icon="trash-2" disabled>Delete keyframe</button>
        <button id="clearKeys" class="danger" data-icon="eraser">Clear</button>
      </div>
      <div class="keys-list" id="keyList"></div>
    </div>
    <div>
      <h3>Audio</h3>
      <div id="tracks" class="dim small">Loading…</div>
    </div>
    <div>
      <h3>Export</h3>
      <div class="field"><label>Size</label>
        <select id="preset" style="flex:1">
          <option value="original">Full quality</option>
          <option value="discord10">Discord (10 MB)</option>
          <option value="discord50">Discord Nitro (50 MB)</option>
        </select></div>
      <label class="field small" style="gap:6px"><input type="checkbox" id="copyAfter" checked> Copy to clipboard when done</label>
      <button id="exportBtn" class="primary" data-icon="download" style="width:100%;margin-top:6px">Export</button>
      <div class="progress" style="margin-top:8px;display:none" id="prog"><div></div></div>
      <div id="result" class="small" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
const video = document.getElementById("video"), stage = document.getElementById("stage"), wrap = document.getElementById("wrap");
const tl = document.getElementById("tl");
let info = null, dur = 0, inT = 0, outT = 0, keys = [], selKey = -1;
let ctx = null, players = [];   // per-track audio, mixed live with WebAudio
const trackState = [];          // {index, volume, muted}
let ownTracks = [];              // indexes of tracks that make up the sound (not the Mix)

document.getElementById("title").textContent = id.split("/").pop().replace(/\.[^.]+$/, "");
document.title = "Edit · " + document.getElementById("title").textContent + TITLE_END;
video.src = `/media?id=${enc(id)}`;

// ---------- layout ----------
function fit() {
  if (!info) return;
  const ar = info.width / info.height || 16 / 9;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const w = Math.min(W, H * ar);
  stage.style.width = w + "px";
  stage.style.height = w / ar + "px";
}
addEventListener("resize", fit);

const pct = t => (dur ? (t / dur) * 100 : 0) + "%";
function drawTimeline() {
  document.getElementById("shadeL").style.cssText = `left:0;width:${pct(inT)}`;
  document.getElementById("shadeR").style.cssText = `left:${pct(outT)};right:0`;
  document.getElementById("selBox").style.cssText = `left:${pct(inT)};width:${pct(outT - inT)}`;
  document.getElementById("hIn").style.left = pct(inT);
  document.getElementById("hOut").style.left = pct(outT);
  document.getElementById("sel").textContent = `Selection ${fmtTime(outT - inT, true)}`;
  const box = document.getElementById("keys"), list = document.getElementById("keyList");
  box.textContent = ""; list.textContent = "";
  keys.forEach((k, i) => {
    box.append(h("div", { class: "key" + (i === selKey ? " on" : ""), style: `left:${pct(k.t)}`,
      onpointerdown: e => { e.stopPropagation(); seek(k.t); } }));
    list.append(h("span", { class: i === selKey ? "on" : "", onclick: () => seek(k.t) }, `${fmtTime(k.t, true)} · ${k.z.toFixed(2)}×`));
  });
  document.getElementById("delKey").disabled = selKey < 0;
}

function drawHead() {
  const t = video.currentTime;
  document.getElementById("head").style.left = pct(t);
  document.getElementById("time").textContent = `${fmtTime(t, true)} / ${fmtTime(dur, true)}`;
}

// ---------- zoom ----------
function view(t) {
  const z = Math.max(1, keyValue(keys, t, "z"));
  const cx = keyValue(keys, t, "x"), cy = keyValue(keys, t, "y");
  const ox = Math.min(Math.max(cx - 1 / (2 * z), 0), 1 - 1 / z), oy = Math.min(Math.max(cy - 1 / (2 * z), 0), 1 - 1 / z);
  return { z, cx, cy, ox, oy };
}
function applyView() {
  const v = view(video.currentTime);
  video.style.transform = v.z > 1.0005 ? `scale(${v.z}) translate(${-v.ox * 100}%, ${-v.oy * 100}%)` : "";
  const near = keys.findIndex(k => Math.abs(k.t - video.currentTime) < 0.05);
  if (near !== selKey) { selKey = near; drawTimeline(); }
  if (document.activeElement !== zoomEl) { zoomEl.value = v.z; }
  document.getElementById("zoomVal").textContent = v.z.toFixed(2) + "×";
}
// The keyframe at the playhead, made if there isn't one (starting from the current view).
function keyHere() {
  const t = video.currentTime;
  let k = keys.find(k => Math.abs(k.t - t) < 0.05);
  if (!k) {
    const v = view(t);
    k = { t, z: v.z, x: v.cx, y: v.cy };
    keys.push(k);
    keys.sort((a, b) => a.t - b.t);
  }
  return k;
}
const zoomEl = document.getElementById("zoom");
zoomEl.oninput = () => { keyHere().z = +zoomEl.value; applyView(); drawTimeline(); };
document.getElementById("addKey").onclick = () => { keyHere(); applyView(); drawTimeline(); };
document.getElementById("delKey").onclick = () => { if (selKey >= 0) keys.splice(selKey, 1); selKey = -1; applyView(); drawTimeline(); };
document.getElementById("clearKeys").onclick = () => { keys = []; selKey = -1; applyView(); drawTimeline(); };

// Drag the picture to aim the zoom.
stage.addEventListener("pointerdown", e => {
  const v = view(video.currentTime);
  if (v.z <= 1.0005) return;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("drag");
  const k = keyHere();
  // Start from the clamped centre so the view doesn't jump.
  k.x = v.ox + 1 / (2 * v.z); k.y = v.oy + 1 / (2 * v.z);
  const start = { x: e.clientX, y: e.clientY, kx: k.x, ky: k.y };
  const r = stage.getBoundingClientRect();
  const move = ev => {
    const half = 1 / (2 * k.z);
    k.x = Math.min(1 - half, Math.max(half, start.kx - (ev.clientX - start.x) / (r.width * k.z)));
    k.y = Math.min(1 - half, Math.max(half, start.ky - (ev.clientY - start.y) / (r.height * k.z)));
    applyView();
  };
  const up = () => { stage.classList.remove("drag"); stage.removeEventListener("pointermove", move); stage.removeEventListener("pointerup", up); drawTimeline(); };
  stage.addEventListener("pointermove", move);
  stage.addEventListener("pointerup", up);
});

// ---------- playback ----------
function seek(t) {
  video.currentTime = Math.min(Math.max(0, t), dur);
  for (const p of players) p.el.currentTime = video.currentTime;
  drawHead(); applyView();
}
function togglePlay() {
  if (video.paused) {
    if (video.currentTime >= outT - 0.05 || video.currentTime < inT) seek(inT);
    if (ctx) ctx.resume();
    video.play();
  } else video.pause();
}
document.getElementById("playBtn").onclick = togglePlay;
video.addEventListener("play", () => { setLabel(document.getElementById("playBtn"), "pause", "Pause"); for (const p of players) { p.el.currentTime = video.currentTime; p.el.play().catch(() => {}); } });
video.addEventListener("pause", () => { setLabel(document.getElementById("playBtn"), "play", "Play"); for (const p of players) p.el.pause(); });
video.addEventListener("seeked", () => { for (const p of players) p.el.currentTime = video.currentTime; });

function frame() {
  if (!video.paused) {
    if (video.currentTime >= outT) { video.pause(); seek(inT); }
    for (const p of players) if (Math.abs(p.el.currentTime - video.currentTime) > 0.08) p.el.currentTime = video.currentTime;
  }
  drawHead(); applyView();
  requestAnimationFrame(frame);
}

// Timeline: click/drag to seek; drag the yellow handles to trim.
tl.addEventListener("pointerdown", e => {
  const r = tl.getBoundingClientRect();
  const at = ev => Math.min(dur, Math.max(0, ((ev.clientX - r.left) / r.width) * dur));
  const which = e.target.id === "hIn" ? "in" : e.target.id === "hOut" ? "out" : "seek";
  tl.setPointerCapture(e.pointerId);
  const move = ev => {
    const t = at(ev);
    if (which === "in") { inT = Math.min(t, outT - 0.2); seek(inT); }
    else if (which === "out") { outT = Math.max(t, inT + 0.2); seek(outT); }
    else seek(t);
    drawTimeline();
  };
  move(e);
  const up = () => { tl.removeEventListener("pointermove", move); tl.removeEventListener("pointerup", up); };
  tl.addEventListener("pointermove", move);
  tl.addEventListener("pointerup", up);
});

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  const step = 1 / (info?.fps || 60);
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "i" || e.key === "I") { inT = Math.min(video.currentTime, outT - 0.2); drawTimeline(); }
  else if (e.key === "o" || e.key === "O") { outT = Math.max(video.currentTime, inT + 0.2); drawTimeline(); }
  else if (e.key === "k" || e.key === "K") { keyHere(); drawTimeline(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); seek(video.currentTime - (e.shiftKey ? 1 : step)); }
  else if (e.key === "ArrowRight") { e.preventDefault(); seek(video.currentTime + (e.shiftKey ? 1 : step)); }
  else if (e.key === "Delete" && selKey >= 0) { keys.splice(selKey, 1); selKey = -1; drawTimeline(); }
});

// ---------- audio ----------
function audioUI() {
  const box = document.getElementById("tracks");
  box.textContent = "";
  box.className = "";
  if (!ownTracks.length) { box.className = "dim small"; box.textContent = "No audio."; return; }
  for (const i of ownTracks) {
    const s = trackState[i];
    const val = h("span", { class: "val" }, Math.round(s.volume * 100) + "%");
    const mute = h("button", { class: s.muted ? "off" : "" }, s.muted ? "🔇" : "🔊");
    const range = h("input", { type: "range", min: 0, max: 2, step: 0.01, value: s.volume });
    const apply = () => {
      const g = gainFor(i);
      if (g) g.gain.value = s.muted ? 0 : s.volume;
      mute.textContent = s.muted ? "🔇" : "🔊"; mute.className = s.muted ? "off" : "";
      val.textContent = Math.round(s.volume * 100) + "%";
    };
    mute.onclick = () => { s.muted = !s.muted; apply(); };
    range.oninput = () => { s.volume = +range.value; apply(); };
    range.ondblclick = () => { s.volume = 1; range.value = 1; apply(); };
    box.append(h("div", { class: "track" }, mute, h("span", { class: "title" }, info.tracks[i]), range, val));
  }
}

function setupAudio() {
  const t = info.tracks;
  t.forEach((_, i) => trackState[i] = { index: i, volume: 1, muted: false });
  const layered = t.length > 1 && t[0] === "Mix";
  ownTracks = layered ? t.map((_, i) => i).slice(1) : t.map((_, i) => i);
  ctx = new AudioContext();
  if (ownTracks.length === 1 && !layered) {
    // One track: the video's own sound, through a gain node.
    const gain = ctx.createGain();
    ctx.createMediaElementSource(video).connect(gain).connect(ctx.destination);
    singleGain = gain;
  } else if (ownTracks.length) {
    video.muted = true;
    for (const i of ownTracks) {
      const el = new Audio(`/api/track?id=${enc(id)}&i=${i}`);
      el.preload = "auto";
      const gain = ctx.createGain();
      ctx.createMediaElementSource(el).connect(gain).connect(ctx.destination);
      players.push({ index: i, el, gain });
    }
  }
  audioUI();
}
let singleGain = null;
const gainFor = i => players.find(p => p.index === i)?.gain || singleGain;

// ---------- export ----------
document.getElementById("exportBtn").onclick = async () => {
  const btn = document.getElementById("exportBtn"), prog = document.getElementById("prog"), res = document.getElementById("result");
  btn.disabled = true; prog.style.display = ""; prog.firstChild.style.width = "0"; res.textContent = "";
  try {
    const { job } = await api("/api/render", { body: {
      id, start: inT, end: outT, preset: document.getElementById("preset").value,
      zoom: keys.map(k => ({ t: k.t, z: k.z, x: k.x, y: k.y })),
      tracks: trackState.filter(Boolean), copy: document.getElementById("copyAfter").checked,
    } });
    for (;;) {
      await new Promise(r => setTimeout(r, 300));
      const j = await api(`/api/job?job=${job}`);
      prog.firstChild.style.width = (j.progress * 100) + "%";
      if (j.done) {
        if (j.error) throw new Error(j.error);
        const name = j.path.split(/[\\/]/).pop();
        res.textContent = "";
        res.append(h("div", {}, (j.copied ? "Copied to clipboard · " : "Saved · ") + name),
          h("div", { style: "display:flex;gap:6px;margin-top:6px" },
            h("button", { onclick: () => api(`/api/reveal?id=${enc(j.id)}`, { method: "POST" }) }, "Show in folder"),
            h("button", { onclick: () => api(`/api/copy?id=${enc(j.id)}`, { method: "POST" }).then(() => toast("Copied")) }, "Copy")));
        toast(j.copied ? "Exported and copied — paste it anywhere" : "Exported");
        break;
      }
    }
  } catch (e) { res.textContent = e.message; toast(e.message, true); }
  btn.disabled = false;
};

// ---------- start ----------
(async () => {
  try { info = await api(`/api/info?id=${enc(id)}`); }
  catch (e) { toast(e.message, true); return; }
  dur = info.duration; inT = 0; outT = dur;
  tl.style.backgroundImage = `url("/api/sprite?id=${enc(id)}")`;
  fit();
  setupAudio();
  drawTimeline();
  const t0 = +params.get("t") || 0;
  video.addEventListener("loadedmetadata", () => { if (t0) seek(t0); }, { once: true });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
